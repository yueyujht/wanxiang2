server:
  port: 8080

spring:
  application:
    name: wanxiang
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB      # 航线 KMZ 文件上传上限
      max-request-size: 55MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/wanxiang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # password:
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

logging:
  file:
    path: E:/yueyu/wanxiang-logs

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# DJI 上云 API MQTT 接入（不填 broker-url 则不建立连接，应用照常启动）
# 值来自 DJI 开发者平台「上云」配置页
wanxiang:
  mqtt:
    broker-url: tcp://127.0.0.1:1883
    username: yueyu
    password: 123456
    inbound-topic: sys/product/+/status,thing/product/+/osd,thing/product/+/state,thing/product/+/events,thing/product/+/requests,thing/product/+/property/set_reply,thing/product/+/services_reply
    client-id: wanxiang
  # DJI 上云 API 应用凭据（创建「上云 API」应用后拿到，License 校验时下发给设备）
  dji:
    app-id: your-app-id
    app-key: your-app-key
    app-license: your-app-license
    ntp-server-host: your-ntp-server
    ntp-server-port: 123   # NTP 端口，默认 123

  # 直播推流兜底配置：开始直播请求未显式传 url 时按协议类型取用。
  # RTMP/WHIP 的流名自动取 video_id（/ 替换为 _），GB28181 为服务器端固定参数串
  live:
    rtmp-url: rtmp://127.0.0.1:1935/live        # RTMP 推流基址（如 SRS/ZLMediaKit），实际推流地址 = 基址/流名
    whip-url: http://127.0.0.1:1985/rtc/v1/whip # WebRTC WHIP 端点前缀，实际地址 = 前缀?app=live&stream=流名
    gb28181-url: ""                             # GB28181 完整参数串（serverIP=..&serverPort=..&serverID=..&agentID=..&agentPassword=..&localPort=..&channel=..）

  # 自定义飞行区：飞行区文件存平台库，设备经 flight_areas_get 拿到下载地址后从平台 HTTP 下载，
  # 该地址必须是机场网络可达的平台地址（内网部署填平台内网 IP）
  flight-area:
    base-url: http://127.0.0.1:8080

  # 航线任务：KMZ 航线文件存平台库，设备经 flighttask_resource_get 拿到下载地址后从平台 HTTP 下载，
  # 该地址必须是机场网络可达的平台地址
  wayline:
    base-url: http://127.0.0.1:8080

  # 对象存储（媒体文件/远程日志由设备直传，未配置则媒体上传功能不可用）：
  # oss:
  #   provider: minio                             # ali / aws / minio
  #   bucket: wanxiang
  #   endpoint: http://127.0.0.1:9000
  #   region: us-east-1
  #   access-key-id: xxx
  #   access-key-secret: xxx
  #   security-token: ""
  #   object-key-prefix: ""                       # 媒体存储目录前缀，缺省按网关 SN 分目录



# Sa-Token 配置（会话持久化到 Redis）
sa-token:
  token-name: satoken          # token 名称（请求头）
  timeout: 2592000             # token 有效期（秒），默认 30 天
  active-timeout: -1           # 活跃超时，-1 表示不限制
  is-concurrent: true          # 允许同端并发登录
  is-share: true               # 同端登录共享同一 token
  token-style: uuid            # token 风格
  is-log: false
  is-print: false